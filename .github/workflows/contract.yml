name: Contract

# Runs the library against a real Cellarion server every night, so a change
# in the API's shape is caught here before it reaches Home Assistant users.
# Needs two repository secrets: CELLARION_CONTRACT_URL (e.g.
# https://cellarion.app) and CELLARION_CONTRACT_TOKEN (a read-scoped token
# for a dedicated test account). The tests never write anything.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest tests/contract -q -ra
        env:
          CELLARION_CONTRACT_URL: ${{ secrets.CELLARION_CONTRACT_URL }}
          CELLARION_CONTRACT_TOKEN: ${{ secrets.CELLARION_CONTRACT_TOKEN }}
